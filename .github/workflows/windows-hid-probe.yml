name: Windows HID probe checks
on:
  push:
    paths:
      - 'tools/windows-probe/**'
      - 'tools/protocol/**'
      - '.github/workflows/windows-hid-probe.yml'
  pull_request:
    paths:
      - 'tools/windows-probe/**'
      - 'tools/protocol/**'
      - '.github/workflows/windows-hid-probe.yml'
jobs:
  probe-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run pure HID decoder fixtures
        shell: pwsh
        run: |
          python -m compileall -q tools/windows-probe
          python -m unittest discover -s tools/windows-probe -v
          python -m compileall -q tools/protocol
          python -m unittest discover -s tools/protocol -v
      - name: Independent HID parser comparison (synthetic, no private descriptor)
        shell: pwsh
        run: |
          python -m pip install "hid-parser==0.1.0"
          @'
          import sys
          sys.path.insert(0, "tools/protocol")
          from test_descriptor_variants import synthetic_descriptor
          from descriptor_variants import make_variants
          from byte_alignment_matrix import make_alignment_matrix, alignment_findings
          from third_party_variant_check import check
          from hid_parser import ReportDescriptor
          # Verify the external parser can process a conventional valid report.
          ReportDescriptor(list(bytes.fromhex("05 01 09 02 A1 01 09 30 15 00 25 7F 75 08 95 01 81 02 C0")))
          for name, binary in make_variants(synthetic_descriptor()).items():
              result, detail = check(binary)
              print(f"synthetic/{name}: {result}; {detail}")
          for name, binary in make_alignment_matrix(synthetic_descriptor()).items():
              result, detail = check(binary)
              flags = alignment_findings(binary)
              print(f"alignment-matrix/{name}: {result}; {detail}; unaligned={len(flags['unaligned'])}; missing_usage={flags['data_variable_input_missing_usage_fields']}")
          print("CI results are NOT Windows HIDCLASS acceptance tests.")
          '@ | python -
      - name: Parse bounded HIDCLASS ETW capture script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $pwd 'tools/windows-probe/hidclass_trace.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
      - name: Parse bounded HIDCLASS ETW inspection script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $pwd 'tools/windows-probe/hidclass_trace_inspect.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
      - name: Parse HIDCLASS status-correlation script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $pwd 'tools/windows-probe/hidclass_trace_status.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
      - name: Parse bounded targeted HIDCLASS restart trace script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $pwd 'tools/windows-probe/hidclass_restart_trace.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
      - name: Parse offline HIDCLASS descriptor extraction script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $pwd 'tools/windows-probe/hidclass_extract_descriptor.ps1'),
            [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
      - name: Import Windows APIs and display CLI help
        shell: pwsh
        run: |
          python tools/windows-probe/hid_probe.py --help
          python tools/windows-probe/gatt_probe.py --help
          python tools/windows-probe/adv_probe.py --help
      - name: Install BLE Windows Runtime and validate imports
        shell: pwsh
        run: |
          python -m pip install "bleak>=2,<4"
          python -c "from bleak import BleakScanner; assert callable(BleakScanner); print('Bleak scanner import OK')"
          python -c "from winrt.windows.devices.bluetooth import BluetoothLEDevice, BluetoothCacheMode; from winrt.windows.devices.enumeration import DeviceInformation; assert hasattr(DeviceInformation, 'find_all_async_aqs_filter'); assert hasattr(BluetoothLEDevice, 'get_device_selector_from_pairing_state'); print('WinRT AQS overloads OK')"
      - name: Test PnP quick mode and bounded detail lookups
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/windows-probe/test_pnp_probe.ps1
      - name: Test PnP parent/container association (mocked hardware)
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/windows-probe/test_pnp_correlate.ps1
      - name: Test remote Code 10 and Kernel-PnP event redaction
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/windows-probe/test_pnp_failure.ps1
      - name: Check native PowerShell PnP read-only diagnostics
        shell: pwsh
        timeout-minutes: 2
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/windows-probe/pnp_probe.ps1
      # Physical BLE adapter/remote is not available on CI runners.
